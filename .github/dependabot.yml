# Monthly update PRs, one per ecosystem, each run through CI like any other PR. Front-end libraries are pinned copies
# in wwwroot/lib (no package manager) and stay manual; see AGENTS.md for bumping LIB in sw.js when they change.
version: 2
updates:
  # Every project through Plate.slnx, plus dotnet-ef in dotnet-tools.json.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ['*']
    open-pull-requests-limit: 3
    ignore:
      # 8.0 moved from Apache 2.0 to Xceed's licence, free only for non-commercial use; 7.x does everything the
      # tests need.
      - dependency-name: FluentAssertions
        versions: ['>= 8']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # The SDK and runtime images are pinned by digest; this refreshes the digests, which README's "Updating base images"
  # otherwise asks for by hand each month.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    groups:
      images:
        patterns: ['*']
    ignore:
      # Dependabot reads the 10.0 tag as a version and offered sdk:11.0, while global.json, CI and the runtime image
      # stay on .NET 10 (LTS). Moving to a new .NET is its own change.
      - dependency-name: '*'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
