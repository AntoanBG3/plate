name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JavaScript, Core and Web
            mode: --ci-core-web
          - name: Browser (Chromium and WebKit)
            mode: --ci-browser
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        if: matrix.mode == '--ci-core-web'
        with:
          node-version: '24'
      - name: Build and test
        env:
          CHECK_MODE: ${{ matrix.mode }}
        run: bash tools/check.sh "$CHECK_MODE"
