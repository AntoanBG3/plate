name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    # Pinned: when ubuntu-latest moved to 26.04 (between 2026-11-08 and 2026-11-14) WebKit began to drop taps and
    # stall there, failing a different browser test on almost every run. 24.04 was the last image with green runs.
    # Move to 26.04 when a Playwright release with a steadier WebKit for it passes several runs in a row.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JavaScript, Core and Web
            mode: --ci-core-web
            artifact: core-web
          - name: Browser (Chromium and WebKit)
            mode: --ci-browser
            artifact: browser
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        if: matrix.mode == '--ci-core-web'
        with:
          node-version: '24'
      - name: Build and test
        env:
          CHECK_MODE: ${{ matrix.mode }}
          CHECK_RESULTS_DIR: ${{ runner.temp }}/test-results
        run: bash tools/check.sh "$CHECK_MODE"
      # The .trx files name every failed test with its message and output; on the browser job, a test that failed its
      # retry too leaves a Playwright trace per phone (npx playwright show-trace <zip>).
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.artifact }}
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
          retention-days: 14
