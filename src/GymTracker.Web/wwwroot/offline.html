<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Offline · Gym</title>
<script src="/js/offline.js"></script>
<link rel="stylesheet" href="/lib/fonts/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<style>
    .offline { min-height: 100dvh; display: grid; place-content: center; padding: var(--s-6); text-align: center; }
    html[lang="bg"] [lang="en"], html[lang="en"] [lang="bg"] { display: none; }
</style>
</head>
<body class="no-tabs">
<main class="offline">
    <div class="empty">
        <div class="empty-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 3.5l17 17M8.75 8.75A9.5 9.5 0 0 0 4.25 11.5M12 7c3 0 5.75 1.25 7.75 3.25M7.75 14.5a6 6 0 0 1 3-1.75M14.75 13a6 6 0 0 1 1.5 1.25"/><circle cx="12" cy="18.25" r="1.2" fill="currentColor" stroke="none"/></svg></div>
        <h1 class="large-title" style="font-size: var(--text-title-2)"><span lang="en">No connection</span><span lang="bg">Няма връзка</span></h1>
        <p style="margin-top: var(--s-2)">
            <span lang="en">This page needs the server. Sets you already logged are saved on this phone and will send when you're back online.</span>
            <span lang="bg">Тази страница има нужда от сървъра. Записаните серии са на телефона и ще се изпратят, щом връзката се върне.</span>
        </p>
        <button type="button" class="btn btn-primary" data-reload><span lang="en">Try again</span><span lang="bg">Опитай пак</span></button>
    </div>
</main>
</body>
</html>
