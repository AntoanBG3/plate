# Production stack on wizard. The repository is checked out at ~/docker/gymtracker and this file is
# run from there: docker compose -f docker/docker-compose.yml up -d --build
# State lives next to the checkout (../db, ../keys) so the nightly ~/docker snapshot covers it.
name: gymtracker

services:
  db:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    container_name: gymtracker-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # jit=off: Postgres JIT only pays off for large analytic queries and costs CPU when it kicks in.
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=15", "-c", "jit=off"]
    volumes:
      # The postgres 18 image keeps data under /var/lib/postgresql/18/docker; mount the parent.
      - ../db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Set by the deploy command from the Mac: APP_VERSION=$(git rev-parse --short HEAD)
        APP_VERSION: ${APP_VERSION:-unknown}
    image: gymtracker-app:latest
    container_name: gymtracker-app
    # antoan, so the bind-mounted keys directory is writable without sudo.
    user: "1000:1000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=8"
      DataProtection__KeysPath: /keys
      ReverseProxy__KnownProxies: 172.30.0.10
      OpenRouter__ApiKey: "${OPENROUTER_API_KEY:-}"
      OpenRouter__Model: "${OPENROUTER_MODEL:-}"
      OpenFoodFacts__ContactEmail: "${OFF_CONTACT_EMAIL:-}"
      AllowedHosts: "gym.peychev.uk;localhost"
      # Passkeys are bound to this host name; changing it makes existing passkeys stop working.
      Passkeys__ServerDomain: gym.peychev.uk
      Security__CspEnforce: "${CSP_ENFORCE:-false}"
      Telegram__BotToken: "${TELEGRAM_BOT_TOKEN:-}"
      Telegram__ChatId: "${TELEGRAM_CHAT_ID:-}"
      Admin__CloudflareAccess__TeamDomain: "${CF_ACCESS_TEAM_DOMAIN:-}"
      Admin__CloudflareAccess__Audience: "${CF_ACCESS_AUD:-}"
    volumes:
      - ../keys:/keys
    # No published ports: cloudflared reaches http://gymtracker-app:8080 over the tunnel network.
    networks:
      - default
      - tunnel
    mem_limit: 256m
    cpus: "1.0"
    # Nothing in the image is written at runtime; /tmp and the keys mount are the only writable paths.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    restart: unless-stopped

networks:
  tunnel:
    external: true
