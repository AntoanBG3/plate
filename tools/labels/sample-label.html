<!doctype html>
<!-- A synthetic Bulgarian nutrition label for `ai test label` and the browser tests (SPEC 6.6).
     Known values: 1046 kJ / 250 kcal, fat 10 g (saturated 4 g), carbs 30 g (sugars 12 g), fiber 2 g, protein 10 g, salt 0.8 g.
     ?barcode=1 adds EAN-13 5901234123457 under the table. -->
<html lang="bg">
<meta charset="utf-8">
<style>
  body { margin: 0; background: #f4efe6; font: 22px/1.3 "Helvetica Neue", Arial, sans-serif; color: #111; }
  .pack { margin: 40px; padding: 24px 28px; background: #fff; border: 3px solid #111; width: 760px; }
  h1 { font-size: 26px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border-top: 2px solid #111; padding: 6px 4px; text-align: left; }
  td:last-child, th:last-child { text-align: right; }
  .sub td:first-child { padding-left: 28px; }
  svg { display: block; margin: 20px 0 0 40px; }
</style>
<div class="pack">
  <h1>Хранителна стойност</h1>
  <table>
    <tr><th></th><th>на 100 g</th></tr>
    <tr><td>Енергийна стойност</td><td>1046 kJ / 250 kcal</td></tr>
    <tr><td>Мазнини</td><td>10 g</td></tr>
    <tr class="sub"><td>от които наситени мастни киселини</td><td>4 g</td></tr>
    <tr><td>Въглехидрати</td><td>30 g</td></tr>
    <tr class="sub"><td>от които захари</td><td>12 g</td></tr>
    <tr><td>Фибри</td><td>2 g</td></tr>
    <tr><td>Белтъчини</td><td>10 g</td></tr>
    <tr><td>Сол</td><td>0,8 g</td></tr>
  </table>
</div>
<script>
  // EAN-13 from the standard L/G/R patterns, drawn only when asked for.
  if (new URLSearchParams(location.search).has("barcode")) {
    const code = "5901234123457";
    const L = ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
    const G = L.map((p) => [...p].map((b) => (b === "0" ? "1" : "0")).reverse().join(""));
    const R = L.map((p) => [...p].map((b) => (b === "0" ? "1" : "0")).join(""));
    const parity = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"][+code[0]];
    let bits = "101";
    for (let i = 1; i <= 6; i++) bits += (parity[i - 1] === "L" ? L : G)[+code[i]];
    bits += "01010";
    for (let i = 7; i <= 12; i++) bits += R[+code[i]];
    bits += "101";
    const w = 4, quiet = 11 * w;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", bits.length * w + 2 * quiet);
    svg.setAttribute("height", 180);
    svg.innerHTML = `<rect width="100%" height="100%" fill="#fff"/>` +
      [...bits].map((b, i) => (b === "1" ? `<rect x="${quiet + i * w}" y="10" width="${w}" height="140" fill="#000"/>` : "")).join("") +
      `<text x="50%" y="175" font-size="22" text-anchor="middle" font-family="monospace">${code}</text>`;
    document.body.append(svg);
  }
</script>
</html>
