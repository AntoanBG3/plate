    <rect x="150" y="241" width="212" height="30" rx="15"/>
    <rect x="112" y="176" width="46" height="160" rx="18"/>
    <rect x="78" y="208" width="34" height="96" rx="14"/>
    <rect x="354" y="176" width="46" height="160" rx="18"/>
    <rect x="400" y="208" width="34" height="96" rx="14"/>
  </g>
</svg>
