<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Plate: a weight plate with a bite out of it. The plate (radius 33) stays inside the maskable safe zone
       (a circle of radius 40 around the centre). The bite is part of the outline, not a mask, so NSImage draws it. -->
  <rect width="100" height="100" fill="#ff6a2b"/>
  <path d="M61.17 18.95A33 33 0 1 0 81.76 41.02A9.5 9.5 0 0 1 69.33 31.97A9.5 9.5 0 0 1 61.17 18.95Z" fill="#fff3e6"/>
  <!-- Handle cut-outs near the rim at 100, 220 and 340 degrees, clear of the bite. -->
  <g fill="none" stroke="#ff6a2b" stroke-width="6.5" stroke-linecap="round">
    <path d="M37.75 28.78A24.5 24.5 0 0 1 54.25 25.87"/>
    <path d="M37.75 71.22A24.5 24.5 0 0 1 26.98 58.38"/>
    <path d="M74.5 50A24.5 24.5 0 0 1 68.77 65.75"/>
  </g>
  <circle cx="50" cy="50" r="6" fill="#ff6a2b"/>
</svg>
